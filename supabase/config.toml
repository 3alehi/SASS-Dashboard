# Supabase CLI local development configuration.
# Run `supabase start` from the repo root to launch the local stack
# (Postgres, Auth, Realtime, Studio) and apply migrations from database/migrations.

project_id = "nexora"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true
enable_confirmations = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[realtime]
enabled = true

[db.migrations]
schema_paths = ["../database/migrations"]
